include: package:lints/recommended.yaml

analyzer:
  errors:
    unused_local_variable: warning
    unused_import: warning
    dead_code: warning

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - sized_box_for_whitespace
    - always_declare_return_types
    - annotate_overrides
    - prefer_is_empty
    - prefer_is_not_empty
