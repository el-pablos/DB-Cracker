name: db_cracker_tamaengs
description: "Platform Data Intelligence Pemerintah Indonesia — PDDIKTI, Pengadaan, Statistik BPS, Ekonomi, Bencana."
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^14.0.0

  # Network
  dio: ^5.4.0
  connectivity_plus: ^6.0.0
  http: ^1.2.0

  # Local Storage
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  hive_flutter: ^1.1.0

  # DI
  get_it: ^7.6.0
  injectable: ^2.3.0

  # Maps
  flutter_map: ^7.0.0
  latlong2: ^0.9.0

  # Charts
  fl_chart: ^0.68.0

  # Functional
  dartz: ^0.10.1
  equatable: ^2.0.5

  # Annotations
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Existing
  provider: ^6.0.5
  url_launcher: ^6.1.11
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  injectable_generator: ^2.4.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
          weight: 700
